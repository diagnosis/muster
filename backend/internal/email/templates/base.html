<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#f5f2ec; font-family:Georgia, 'Times New Roman', serif;">
<div style="max-width:560px; margin:0 auto; padding:32px 24px;">
    <p style="font-size:24px; font-weight:bold; color:#1a1a1a; margin:0 0 24px;">Muster</p>
    <div style="background:#ffffff; border-radius:8px; padding:32px 28px;">
        <h1 style="font-size:20px; color:#1a1a1a; margin:0 0 16px;">{{.Heading}}</h1>
        <p style="font-size:16px; line-height:1.5; color:#333; margin:0 0 24px;">{{.Body}}</p>
        {{if .CTALabel}}
            <a href="{{.CTAURL}}" style="display:inline-block; background-color:#0d7377; color:#ffffff; text-decoration:none; padding:12px 24px; border-radius:6px; font-size:16px;">{{.CTALabel}}</a>
        {{end}}
    </div>
    <p style="font-size:12px; color:#999; margin:24px 0 0;">Muster — hike together. If you didn't request this email, you can ignore it.</p>
</div>
</body>
</html>
