name: deploy.yml
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod }
      - run: go install github.com/pressly/goose/v3/cmd/goose@latest

        # Runs against prod BEFORE the new binary ships. Every migration must
        # therefore be safe under the currently-running binary (expand-only;
        # contract in a later release).
      - name: Migrate
        run: goose -dir ./migrations postgres "${{ secrets.NEON_PROD_URL }}" up

      - name: Build
        run: GOOS=linux GOARCH=amd64 go build -o muster ./cmd/muster

      - name: Write deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Ship binary
        run: scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new muster ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/muster/backend/muster.new

      - name: Swap and restart
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'mv /var/www/muster/backend/muster.new /var/www/muster/backend/muster && sudo systemctl restart muster'

      - name: Verify
        run: curl --retry 10 --retry-delay 5 --retry-all-errors --retry-connrefused -sSf https://muster-api.safadev.app/health