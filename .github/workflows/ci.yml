# .github/workflows/ci.yml
name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [both, backend, frontend]
        default: both

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod }
      - name: Install golangci-lint v2
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin latest
      - run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - run: make check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*' }
      - run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent: main
          branch_name: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
          username: neondb_owner

      - name: Migrate
        run: goose -dir ./migrations postgres "${{ steps.neon.outputs.db_url_with_pooler }}" up

      - name: Boot server
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          RATE_LIMIT_RPS: "100"
          RATE_LIMIT_BURST: "200"
        run: |
          go build -o muster ./cmd/muster
          ./muster &
          curl --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors -sS http://localhost:8088/api/health

      - name: Install e2e deps
        if: inputs.suite != 'frontend'
        run: npm ci
        working-directory: backend/e2e

      - name: Run suite
        if: inputs.suite != 'frontend'
        env:
          BASE_URL: "http://localhost:8088"
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}

        run: make e2e

      - name: Install e2e frontend deps
        if: inputs.suite != 'backend'
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        if: inputs.suite != 'backend'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: inputs.suite != 'backend' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend

      - name: Install Playwright OS deps
        if: inputs.suite != 'backend' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
        working-directory: frontend

      - name: Run UI suite
        if: inputs.suite != 'backend'
        run: npm run e2e
        working-directory: frontend
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 'playwright-report'
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}